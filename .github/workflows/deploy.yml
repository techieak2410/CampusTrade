# github ci-cd
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & Push Backend
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campustrade-backend ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campustrade-backend

      # 4. Build & Push Frontend
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campustrade-frontend ./frontend
          
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campustrade-frontend

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Restart Kubernetes Deployments
        run: |
          kubectl rollout restart deployment backend-deployment
          kubectl rollout restart deployment frontend-deployment

       # 9. Verify Deployment
      - name: Verify Kubernetes Resources
        run: |
          kubectl get pods
          kubectl get svc